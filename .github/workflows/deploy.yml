name: Deploy

# Publishes the CareerPilot demo to two free Vercel projects on every push to
# main. careerpilot-demo serves the search and dashboard pages as static files
# with the Flask backend in mock mode as a Python function under /api.
# careerpilot-meet serves the Next.js interview room from meet/. The pages are
# published once more after the room so they link to its address, and the
# backend accepts calls from it. No other host or payment method is needed.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  SITE_PROJECT: careerpilot-demo
  MEET_PROJECT: careerpilot-meet

jobs:
  deploy:
    name: Test and deploy to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Project/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: meet/package-lock.json
      - name: Install backend dependencies
        run: pip install -r Project/requirements.txt pytest
      - name: Run backend tests
        run: python -m pytest -q
      - name: Install interview room dependencies
        working-directory: meet
        run: npm ci --no-audit --no-fund
      - name: Typecheck and test the interview room
        working-directory: meet
        run: |
          npx tsc --noEmit
          npm test

      - name: Check for the Vercel token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::The VERCEL_TOKEN repository secret is missing"
            exit 1
          fi
      - name: Publish the pages and the backend
        id: site
        run: |
          site=$(.github/scripts/vercel_deploy.sh . "$SITE_PROJECT" --env CAREERPILOT_MOCK=1 | tail -n 1)
          echo "url=$site" >> "$GITHUB_OUTPUT"
          echo "Pages at $site" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish the interview room
        id: meet
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        run: |
          flags=(--build-env "NEXT_PUBLIC_CAREERPILOT_API_URL=${{ steps.site.outputs.url }}/api")
          # The room still loads without LiveKit keys and explains what is
          # missing when someone tries to join.
          for name in LIVEKIT_URL LIVEKIT_API_KEY LIVEKIT_API_SECRET; do
            if [ -n "${!name}" ]; then
              flags+=(--env "$name=${!name}")
            else
              echo "::warning::$name is not set, so the interview room cannot sign LiveKit tokens yet"
            fi
          done
          meet=$(.github/scripts/vercel_deploy.sh meet "$MEET_PROJECT" "${flags[@]}" | tail -n 1)
          echo "url=$meet" >> "$GITHUB_OUTPUT"
          echo "Interview room at $meet" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Point the pages at the interview room
        run: |
          meet="${{ steps.meet.outputs.url }}"
          .github/scripts/vercel_deploy.sh . "$SITE_PROJECT" \
            --env CAREERPILOT_MOCK=1 \
            --env "CAREERPILOT_ALLOWED_ORIGINS=$meet" \
            --build-env "CAREERPILOT_MEET_URL=$meet"
      - name: Check the live site
        run: |
          python .github/scripts/live_check.py "${{ steps.site.outputs.url }}" \
            --meet "${{ steps.meet.outputs.url }}"
