name: Pages demo

# Publishes a static copy of the CareerPilot demo to GitHub Pages on every push
# to main. It needs no repository secret, only the built-in GITHUB_TOKEN, which
# commits the built pages to the gh-pages branch that GitHub Pages serves.
#
# GitHub Pages serves files only, so the build records the mock backend's
# answers with scripts/record_demo_api.py and the pages replay them in the
# browser. The search form, the dashboard with its sample jobs and the Train
# button all work. The live interview room needs LiveKit, so its link opens a
# short notice instead. The full demo with the real backend function is still
# published to Vercel by deploy.yml once VERCEL_TOKEN is saved.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PAGES_URL: https://rohitdurbha.github.io/CareerPilot

jobs:
  pages:
    name: Test, build and publish the static demo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Project/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend dependencies
        run: pip install -r Project/requirements.txt pytest
      - name: Run backend tests
        run: python -m pytest -q
      - name: Record the mock backend answers
        run: python scripts/record_demo_api.py "$RUNNER_TEMP/demo-api.json"
      - name: Build the static pages
        env:
          CAREERPILOT_DEMO_RESPONSES: ${{ runner.temp }}/demo-api.json
        run: |
          node scripts/build-site.mjs "$RUNNER_TEMP/pages-site"
          # The pages are plain files, so GitHub Pages should not run Jekyll.
          touch "$RUNNER_TEMP/pages-site/.nojekyll"
      - name: Publish to the gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/publish_gh_pages.sh "$RUNNER_TEMP/pages-site"
      - name: Check the live pages
        run: |
          echo "Static demo at $PAGES_URL" | tee -a "$GITHUB_STEP_SUMMARY"
          # GitHub Pages takes a minute or two to serve a new commit.
          for attempt in $(seq 1 30); do
            if curl -fsS "$PAGES_URL/settings.js" | grep -q "$GITHUB_SHA"; then
              break
            fi
            sleep 10
          done
          if ! python3 .github/scripts/live_check.py "$PAGES_URL" --static; then
            echo "::error::$PAGES_URL is not serving the demo. If GitHub Pages is off, open Settings, Pages and choose Deploy from a branch with gh-pages and / (root), then run this workflow again."
            exit 1
          fi
