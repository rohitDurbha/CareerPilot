name: Pages demo

# Publishes a static copy of the CareerPilot demo to GitHub Pages on every push
# to main. It needs no repository secret, only the built-in GITHUB_TOKEN.
#
# GitHub Pages serves files only, so the build records the mock backend's
# answers with scripts/record_demo_api.py and the pages replay them in the
# browser. The search form, the dashboard with its sample jobs and the Train
# button all work. The live interview room needs LiveKit, so its link opens a
# short notice instead. The full demo with the real backend function is still
# published to Vercel by deploy.yml once VERCEL_TOKEN is saved.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Test and build the static demo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Project/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend dependencies
        run: pip install -r Project/requirements.txt pytest
      - name: Run backend tests
        run: python -m pytest -q
      - name: Record the mock backend answers
        run: python scripts/record_demo_api.py "$RUNNER_TEMP/demo-api.json"
      - name: Build the static pages
        env:
          CAREERPILOT_DEMO_RESPONSES: ${{ runner.temp }}/demo-api.json
        run: node scripts/build-site.mjs pages-site
      - name: Turn on GitHub Pages
        id: configure
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Explain how to turn on GitHub Pages
        if: steps.configure.outcome == 'failure'
        run: |
          echo "::error::GitHub Pages is off for this repository. In Settings, Pages, set Source to GitHub Actions, then run this workflow again."
          exit 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-site

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Check the live pages
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          echo "Static demo at $url" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 .github/scripts/live_check.py "$url" --static
