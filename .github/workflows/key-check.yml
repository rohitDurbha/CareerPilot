name: Key check

# Sends one tiny prompt to Groq and to Gemini each day, so a key that stops
# working shows up as a failed run instead of a broken feature. Each run uses
# two short requests, far inside both free tiers.

on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/scripts/key_check.py
      - .github/workflows/key-check.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send one test prompt to each provider
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python .github/scripts/key_check.py
